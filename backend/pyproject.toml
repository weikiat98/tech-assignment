[project]
name = "policy-analytics-backend"
version = "0.1.0"
description = "Agentic policy data analytics platform - FastAPI + LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "lxml>=5.2",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "mcp>=2.3,<3",
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langfuse>=4.0,<5",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "locust>=2.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: live contract tests against external services (run on demand / nightly)",
    "llm: live LLM evaluation tests (cost money; run on demand / nightly)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
