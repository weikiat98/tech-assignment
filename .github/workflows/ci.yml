name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: mock
      WEB_SEARCH_PROVIDER: mock
      OFFLINE_MODE: "true"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install from uv.lock (Python 3.12 from backend/.python-version)
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check app tests
      - name: Tests with coverage
        run: uv run --locked pytest -m "not contract and not llm" --cov=app --cov-report=xml --cov-report=html --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (mock LLM, offline snapshots)
        run: |
          cp .env.example .env
          echo "LLM_MODE=mock" >> .env
          echo "OFFLINE_MODE=true" >> .env
          echo "WEB_SEARCH_PROVIDER=mock" >> .env
          docker compose up -d --build
      - name: Run one analysis end-to-end
        run: |
          for i in $(seq 1 40); do curl -sf http://localhost:8000/readyz && break; sleep 3; done
          ID=$(curl -sf -X POST http://localhost:8000/api/v1/analyses -H 'Content-Type: application/json' \
               -d '{"query":"Analyse employment trends in the technology sector from 2020-2024"}' | jq -r .id)
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://localhost:8000/api/v1/analyses/$ID | jq -r .status)
            echo "status=$STATUS"; [ "$STATUS" = "completed" ] && exit 0
            [ "$STATUS" = "failed" ] && exit 1; sleep 3
          done; exit 1
      - if: failure()
        run: docker compose logs --tail=200

  images:
    if: github.ref == 'refs/heads/main'
    needs: [smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in backend frontend; do
            docker build -t ghcr.io/$OWNER/policy-analytics-$svc:${{ github.sha }} -t ghcr.io/$OWNER/policy-analytics-$svc:latest ./$svc
            docker push --all-tags ghcr.io/$OWNER/policy-analytics-$svc
          done
