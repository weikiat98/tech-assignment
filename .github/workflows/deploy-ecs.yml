name: Deploy to AWS ECS

# Manual or on version tags. Authenticates with GitHub OIDC (no stored AWS keys).
# Repo settings needed (placeholders until the AWS account exists):
#   secrets.AWS_DEPLOY_ROLE_ARN   <- terraform output github_deploy_role_arn
#   vars: ECR_BACKEND, ECR_FRONTEND, CLUSTER, API_SERVICE, WEB_SERVICE, SUBNETS, TASKS_SG, APP_URL
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Build, push, migrate, roll services, smoke test
        env:
          ECR_BACKEND: ${{ vars.ECR_BACKEND }}
          ECR_FRONTEND: ${{ vars.ECR_FRONTEND }}
          CLUSTER: ${{ vars.CLUSTER }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          WEB_SERVICE: ${{ vars.WEB_SERVICE }}
          SUBNETS: ${{ vars.SUBNETS }}
          TASKS_SG: ${{ vars.TASKS_SG }}
          APP_URL: ${{ vars.APP_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash infra/scripts/deploy.sh
